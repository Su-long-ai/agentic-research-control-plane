[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-research-control-plane"
version = "0.1.0"
description = "Reproducible promotion gates for agentic research workflows"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sulong"}]

[tool.setuptools.packages.find]
where = ["src"]
